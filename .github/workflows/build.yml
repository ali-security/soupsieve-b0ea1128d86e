name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector; empty runs the full suite'
        required: false
        default: ''

env:
  PYTEST_ADDOPTS: -rs

jobs:
  tests:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: 3.9
          - tox-env: py310
            python-version: '3.10'
          - tox-env: py311
            python-version: '3.11'
          - tox-env: nolxml
            python-version: '3.11'
          - tox-env: nohtml5lib
            python-version: '3.10'
          # Ubuntu legs pinned to the CPython patch releases current at the
          # soupsieve 2.4.1 release: later security releases changed html.parser's
          # iframe handling (raw-text content), which breaks the iframe tests
          # independently of soupsieve. Windows setup-python builds stop at older
          # patch releases and keep the original behaviour.
          - platform: ubuntu-22.04
            tox-env: py37
            python-version: '3.7.16'
          - platform: ubuntu-22.04
            tox-env: py38
            python-version: '3.8.16'
          - platform: ubuntu-22.04
            tox-env: py39
            python-version: '3.9.16'
          - platform: ubuntu-22.04
            tox-env: py310
            python-version: '3.10.11'
          - platform: ubuntu-22.04
            tox-env: py311
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nolxml
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m tox -x "testenv.commands=pytest ${{ inputs.test-filter }}" -x "testenv:${TOXENV}.commands=pytest ${{ inputs.test-filter }}"
        elif [ "${TOXENV}" = "nolxml" ] || [ "${TOXENV}" = "nohtml5lib" ]; then
          python -m tox
        else
          python -m tox -x "testenv.commands=pytest --cov soupsieve --cov-append ."
        fi

  package:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9.16'
      - name: Package
        env:
          # Resolve the build backend and its dependencies as of the 2.4.1
          # release, with hatchling pinned to the version that built the
          # public wheel (WHEEL Generator: hatchling 1.14.0).
          PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/
          PIP_CONSTRAINT: ${{ github.workspace }}/../hatchling-constraint.txt
        run: |
          echo "hatchling==1.14.0" > "${PIP_CONSTRAINT}"
          pip install --upgrade build
          python -m build -s -w
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
